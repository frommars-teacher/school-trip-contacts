<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>연락망</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#f3f4f6;color:#17191d;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #2563eb;outline-offset:3px}.app{max-width:480px;min-height:100dvh;margin:auto;background:white;padding-bottom:calc(90px + env(safe-area-inset-bottom))}header{position:sticky;top:0;background:#fff;z-index:2;padding:20px 20px 14px;border-bottom:1px solid #f0f1f3}h1{font-size:23px;letter-spacing:-1px;margin:0 0 18px;font-weight:750}.search{height:46px;background:#f3f4f6;border-radius:11px;display:flex;align-items:center;gap:9px;padding:0 13px;color:#8c929b}.search svg{width:19px;height:19px;flex-shrink:0}input{border:0;background:none;outline:none;width:100%;min-width:0;font-size:15px;color:#17191d}input::placeholder{color:#969ba3}.clear{border:0;background:none;color:#8c929b;padding:7px;font-size:19px}.heading{display:flex;gap:7px;align-items:center;padding:25px 20px 10px}h2{font-size:13px;color:#6b7280;margin:0;font-weight:600}.count{font-size:12px;color:#a0a5ae}.list{padding:0 20px}.row{display:flex;gap:14px;align-items:center;padding:18px 0;border-bottom:1px solid #f0f1f3;min-height:99px}.info{flex:1;min-width:0}.name{font-size:17px;font-weight:650;letter-spacing:-.5px}.role{font-size:12px;font-weight:400;color:#777e88;margin-left:8px;display:inline-block}.detail{font-size:12px;color:#9298a1;margin-top:6px}.number{font-size:13px;color:#747b85;margin-top:6px;font-variant-numeric:tabular-nums}.call{text-decoration:none;border:0;background:#eef4ff;color:#2563eb;border-radius:50%;width:46px;height:46px;display:grid;place-items:center;flex-shrink:0}.call svg{width:20px;height:20px}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;display:flex;background:#fff;border-top:1px solid #eaecef;padding:9px 10px calc(9px + env(safe-area-inset-bottom));z-index:3}.tab{border:0;background:none;flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#9a9fa8;font-size:11px;font-weight:550}.tab svg{width:22px;height:22px}.tab.active{color:#2563eb}.empty{padding:60px 0;text-align:center;font-size:14px;color:#969ba3}.toast{position:fixed;bottom:calc(91px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#282c34;color:white;font-size:12px;padding:12px 18px;border-radius:10px;white-space:nowrap;z-index:5;display:none}@media(min-width:481px){.app{border-left:1px solid #e7e9ed;border-right:1px solid #e7e9ed}.tabs{border-left:1px solid #e7e9ed;border-right:1px solid #e7e9ed}}
</style></head><body><div class="app"><header><h1>연락망</h1><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" type="search" placeholder="이름, 반, 기관 검색" aria-label="연락처 검색"><button class="clear" aria-label="검색어 지우기" hidden>×</button></div></header><main><div class="heading"><h2 id="category">인솔진</h2><span class="count" id="count"></span></div><div class="list" id="list"></div></main><nav class="tabs" aria-label="연락처 분류"><button class="tab active" data-tab="staff" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="7" r="3.5"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/></svg>인솔진</button><button class="tab" data-tab="stay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 21V4h16v17M2 21h20M9 21v-5h6v5M8 8h2m4 0h2M8 12h2m4 0h2"/></svg>숙소·의료</button><button class="tab" data-tab="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="3" width="16" height="16" rx="3"/><path d="M4 11h16M8 6h8M7 19v3m10-3v3M7 15h2m6 0h2"/></svg>여행·지원</button></nav></div><script>
const data={"staff":[["교감","백승헌","","010-4045-3774"],["3학년","김정곤","","010-8852-6590"],["4학년","박준래","","010-5541-1098"],["5·6학년","정조은","","010-4513-3598"],["보건","이은채","","010-5247-1784"],["기타보조인력","김총혜","학부모 명예교사 · 안전 관리 및 응급상황 지원","010-4977-9720"]],"stay":[["숙소 1","빠레브호텔","","0507-1374-8905"],["숙소 2","신화호텔 랜딩관","","1670-8800"],["응급의료기관","한마음병원","응급실 · 제주항 일원","064-750-9119"],["응급의료기관","제주대학교병원","응급의료센터 · 제주시 일원","064-717-1900"],["응급의료기관","서귀포의료원","응급의료센터 · 중문 일원","064-730-3001"]],"guide":[["드라이빙 가이드","신윤조","","010-6683-6066"],["여행사 대표","하나여행사","일정 및 현장 지원","010-7375-1357"],["여행사 실무","하나여행사","일정 및 현장 지원 · 안전 관리 및 응급상황 지원","010-3678-6068"],["야간안전요원","야간안전요원","","010-4799-5079"],["교육지원청","생활인권팀장","사안 발생 시 보고","061-550-0580"]]};
const categories={staff:'인솔진',stay:'숙소·의료',guide:'여행·지원'};
const phoneIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m7 3 3 5-2 2a15 15 0 0 0 6 6l2-2 5 3c-1 5-5 5-9 2A24 24 0 0 1 5 12C2 8 2 4 7 3Z"/></svg>';
let selected='staff';const search=document.querySelector('#search');
function render(){const q=search.value.trim().toLowerCase();const rows=data[selected].filter(r=>r.join(' ').toLowerCase().includes(q));document.querySelector('#category').textContent=categories[selected];document.querySelector('#count').textContent=rows.length;document.querySelector('.clear').hidden=!q;document.querySelector('#list').innerHTML=rows.map(r=>`<article class="row"><div class="info"><div class="name">${r[1]}<span class="role">${r[0]}</span></div>${r[2]?`<div class="detail">${r[2]}</div>`:""}<div class="number">${r[3]}</div></div><a class="call" href="tel:${r[3].replace(/-/g,'')}" aria-label="${r[1]} ${r[0]} 전화하기">${phoneIcon}</a></article>`).join('')||'<div class="empty">검색 결과가 없습니다.</div>'}
search.oninput=render;document.querySelector('.clear').onclick=()=>{search.value='';render();search.focus()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{selected=b.dataset.tab;document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('active',t===b);if(t===b)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current')});search.value='';render();window.scrollTo({top:0})});render();
</script></body></html>
